<!-- 启动遮罩的关键样式内联在这里，且排在外链 CSS 之前：第一帧就得是它，不能是白屏 -->
<style>
  #boot {
    position: fixed; inset: 0; z-index: 70;
    display: grid; place-content: center; justify-items: center; gap: 16px;
    background: #F2F2F7;
    transition: opacity .3s ease;
    /* JS 万一没跑起来（断网半截、脚本报错），1.8 秒后自己隐身，绝不留白屏 */
    animation: boot-fallback 0s linear 1.8s forwards;
  }
  @keyframes boot-fallback { to { opacity: 0; visibility: hidden; } }
  #boot.is-done { opacity: 0; pointer-events: none; }
  #boot svg { width: 72px; height: 72px; color: #007AFF; }
  #boot .boot-title {
    font: 600 17px/1.2 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: #1C1C1E; letter-spacing: .08em;
  }
  @media (prefers-color-scheme: dark) {
    #boot { background: #000; }
    #boot .boot-title { color: #F2F2F7; }
  }
  @media (prefers-reduced-motion: reduce) {
    #boot { transition: none; }
  }
</style>

<!-- Service Worker：让 iOS 主屏幕那个图标每次打开都先跟服务器确认一次。
     没有它的话，旧缓存会一直挡着，上传了新版手机上还是旧的（见 README「上传后手机多久生效」）。
     file:// 双击打开时浏览器不允许注册 SW，这里用协议判断跳过，不影响本地开发。 -->
<script>
if ('serviceWorker' in navigator) {
  var swSecure = location.protocol === 'https:' ||
    location.hostname === 'localhost' ||
    location.hostname === '127.0.0.1';
  if (swSecure) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(function () {});
    });
  }
}
</script>
